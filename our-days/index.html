  backdrop-filter:blur(0px);

}

  content:"";position:absolute;inset:-12%;

 let page=0,lock=false,lastSignature='';
 const perPage=1;
 function decorate(){const layer=document.getElementById('diaryDoodles');if(layer.children.length)return;
  const positions=[[3,9,-12],[88,10,12],[4,38,9],[88,46,-9],[7,72,14],[85,80,-13],[45,91,8]];
  stickers.forEach((url,i)=>{const img=document.createElement('img');img.src=url;img.alt='';img.style.left=positions[i][0]+'%';img.style.top=positions[i][1]+'%';img.style.transform='rotate('+positions[i][2]+'deg)';layer.appendChild(img);});
 }
 function update(){if(lock)return;lock=true;
  const notes=Array.from(board.children).filter(el=>el.classList.contains('note'));
  const signature=notes.map(n=>n.dataset.id||n.querySelector('.content')?.textContent||'').join('|');
  if(signature!==lastSignature){page=0;lastSignature=signature;}
  const total=Math.max(1,Math.ceil(notes.length/perPage));page=Math.max(0,Math.min(page,total-1));
  notes.forEach((note,i)=>{note.style.display=(i>=page*perPage&&i<(page+1)*perPage)?'':'none';});
  controls.hidden=notes.length<=perPage;label.textContent=(page+1)+' / '+total;prev.disabled=page===0;next.disabled=page>=total-1;
  lock=false;
 }
 prev.addEventListener('click',()=>{page--;update();});next.addEventListener('click',()=>{page++;update();});
 const observer=new MutationObserver(()=>requestAnimationFrame(update));observer.observe(board,{childList:true});
 decorate();update();
})();
